    アブストラクト
  </h2>
  <hr>
  "英文要旨" は，論文以外, 通常必要ではありません．
  必要な場合は，150 語程度でお書きください．
  ただし，掲載決定後，国際的に内容を紹介するため，原稿とは別に，
  英文要旨の提出を編集委員会からお願いすることがあります．
