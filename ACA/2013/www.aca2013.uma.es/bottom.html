<script type="text/javascript">
function contar() {
  fecha=new Date(2013,06,07,07,45,00); //año,mes-1,dia,hora-1,minuto,segundo
  fecha2=new Date(2013,06,10,11,45,00); //año,mes-1,dia,hora-1,minuto,segundo
  ahora=new Date();
  dif=new Date(fecha-ahora);
  dif2=new Date(fecha2-ahora);
  Math.dosDigitos = function( value ){
  return (value < 10 )?( "0" + value ):(value)
  }
//  txt=Math.floor(dif/86400000)+' days, '+Math.dosDigitos(dif.getHours())+' hours, '
  extra=(dif.getHours()==0)?(1):(0);
  txt=(Math.floor(dif/86400000)<0)?(0):(Math.floor(dif/86400000)+extra);
  txt2=(Math.floor(dif/86400000)+extra==1)?(' day, '):(' days, ');
  txt=txt+txt2+Math.dosDigitos(dif.getHours())+' hours, '
  +Math.dosDigitos(dif.getMinutes())+' minutes and '+Math.dosDigitos(dif.getSeconds())+' seconds left for ACA 2013';
  txt=(dif.getYear()<70)?('ACA 2013 IS BEING HELD'):(txt);
  txt=(dif2.getYear()<70)?('ACA 2013 IS OVER'):(txt);
  document.getElementById('ACA2013').innerHTML=txt;
}
</script>
