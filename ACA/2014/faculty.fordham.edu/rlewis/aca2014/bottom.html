<HTML>
	<HEAD>
<META http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
		<TITLE>ACA 2014</TITLE>
		<LINK REL="StyleSheet" TYPE="text/css">
	</HEAD>
<script type="text/javascript">
function contar() {
  fecha=new Date(2014,07,09,07,45,00); //año,mes-1,dia,hora-1,minuto,segundo
  fecha2=new Date(2014,07,12,11,45,00); //año,mes-1,dia,hora-1,minuto,segundo
  ahora=new Date();
  dif=new Date(fecha-ahora);
  dif2=new Date(fecha2-ahora);
  Math.dosDigitos = function( value ){
  return (value < 10 )?( "0" + value ):(value)
  }
//  txt=Math.floor(dif/86400000)+' days, '+Math.dosDigitos(dif.getHours())+' hours, '
  extra=(dif.getHours()==0)?(1):(0);
  txt=(Math.floor(dif/86400000)<0)?(0):(Math.floor(dif/86400000)+extra);
  txt2=(Math.floor(dif/86400000)+extra==1)?(' day, '):(' days, ');
  txt=txt+txt2+Math.dosDigitos(dif.getHours())+' hours, '
  +Math.dosDigitos(dif.getMinutes())+' minutes and '+Math.dosDigitos(dif.getSeconds())+' seconds left for ACA 2014';
  txt=(dif.getYear()<70)?('ACA 2014 IS BEING HELD'):(txt);
  txt=(dif2.getYear()<70)?('ACA 2014 IS OVER'):(txt);
  document.getElementById('ACA 2014').innerHTML=txt;
}
</script>
<body onLoad="setInterval('contar()',1000)" BGCOLOR="#FFFFFF" TEXT="#000000" LINK="#000000" VLINK="#000000" ALINK="#000000">
