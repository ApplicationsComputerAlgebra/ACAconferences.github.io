<H1 align="center">Multiple-valued Complex Functions and Computer Algebra
</H1>

<h3 align="center">
<A HREF="../../participants.html#Aslaksen">Helmer Aslaksen</A><br>
</h3>

Date: July 20th (Saturday) <br>
Time: 10:15-10:37.5<br>

<center>
Abstract
</center>

 I will discuss some elementary, but not very well-known facts about
    multiple-valued complex functions, and see how computer algebra systems deal with these
    problems.
